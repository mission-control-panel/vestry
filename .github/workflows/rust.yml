# Windows Rust build/test job for the Vestry product workspace (Phase B S0, T43).
#
# This workflow is a NON-required check by decision: branch protection and the
# set of required checks are Owner-reserved (D31, T43 brief). It deliberately
# does not read or alter any protection setting.
#
# The toolchain comes from rust-toolchain.toml (channel 1.99.1 + rustfmt +
# clippy); `rustup show` in the workspace proves the pin is honoured before any
# build step runs. rusqlite is built with the `bundled` feature, so the job also
# exercises the MSVC C toolchain on the windows-latest image.

name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows workspace
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Check test-support feature
        run: cargo check -p vestry-core --features test-support --locked

      - name: Build (release)
        run: cargo build --release --locked -p vestryd -p vestry-core

      # Release guard (PM decision §11.1 rule 7): the shipped graph must not
      # contain the test-support feature or the testkit package.
      - name: Release guard
        shell: pwsh
        run: |
          $cfg = cargo rustc -p vestry-core --release --locked -- --print cfg
          if ($cfg -match 'feature="test-support"') { Write-Error 'test-support leaked into release graph'; exit 1 }
          $normal = cargo tree -e normal -p vestryd --locked
          if ($normal -match 'vestry-testkit') { Write-Error 'vestry-testkit leaked into vestryd'; exit 1 }
